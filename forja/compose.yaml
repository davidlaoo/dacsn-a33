services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    volumes:
      - datos-forgejo:/data
    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"
    # environment
    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started
    restart: unless-stopped
    networks:
      - interna

  bd:
    image: postgres:18
    volumes:
      - datos-bd:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-usuario}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?postgres necesita secreto}
      - POSTGRES_DB=${POSTGRES_DB:-ejemplo}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      networks:
        - interna
  
  cache:
    image: redis:7.2
    restart: unless-stopped
    volumes:
      - datos-cache:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWD:?falta secreto redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - interna

  correo:
    image: axllent/mailpit:v1.32
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    restart: unless-stopped
    networks:
      - interna

networks:
  interna:

volumes:
  datos-bd:
  datos-cache:
  datos-forgejo: