services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    volumes:
      - datos-forgejo:/data
    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"
    environment:
      - FORGEJO__database__DB_TYPE=${FORGEJO__database__DB_TYPE:-postgres}
      - FORGEJO__database__HOST=${FORGEJO__database__HOST:-localhost}
      - FORGEJO__database__NAME=${FORGEJO__database__NAME:-ejemplo}
      - FORGEJO__database__USER=${FORGEJO__database__USER:-usuario}
      - FORGEJO__database__PASSWD=${FORGEJO__database__PASSWD:?forgejo necesita secreto bd}

      - FORGEJO__server__DOMAIN=${FORGEJO__server__DOMAIN:-localhost}
      - FORGEJO__server__ROOT_URL=${FORGEJO__server__ROOT_URL:?forgejo necesita root url}
      - FORGEJO__server__SSH_PORT=${FORGEJO__server__SSH_PORT:-${PUERTO_SSH:-2222}}
      - FORGEJO__server__SSH_LISTEN_PORT=${FORGEJO__server__SSH_LISTEN_PORT:-22}

      - FORGEJO__security__INSTALL_LOCK=${FORGEJO__security__INSTALL_LOCK:-true}
      - FORGEJO__mailer__ENABLED=${FORGEJO__mailer__ENABLED:-true}
      - FORGEJO__mailer__PROTOCOL=${FORGEJO__mailer__PROTOCOL:-smtp}
      - FORGEJO__mailer__SMTP_ADDR=${FORGEJO__mailer__SMTP_ADDR:-correo}
      - FORGEJO__mailer__SMTP_PORT=${FORGEJO__mailer__SMTP_PORT:-1025}
      - FORGEJO__mailer__FROM=${FORGEJO__mailer__FROM:-blog@dacsn.local}

      - FORGEJO__cache__ADAPTER=${FORGEJO__cache__ADAPTER:-redis}
      - FORGEJO__cache__HOST=${URL_REDIS:?forgejo cache necesita url redis}

      - FORGEJO__session__PROVIDER=${FORGEJO__session__PROVIDER:-redis}
      - FORGEJO__session__PROVIDER_CONFIG=${URL_REDIS:?forgejo session necesita url redis}

      - FORGEJO__queue__TYPE=${FORGEJO__queue__TYPE:-redis}
      - FORGEJO__queue__CONN_STR=${URL_REDIS:?forgejo queue necesita url redis}

      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started
    restart: unless-stopped
    networks:
      - interna

  bd:
    image: postgres:18
    volumes:
      - datos-bd:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-usuario}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?postgres necesita secreto}
      - POSTGRES_DB=${POSTGRES_DB:-ejemplo}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      networks:
        - interna
  
  cache:
    image: redis:7.2
    restart: unless-stopped
    volumes:
      - datos-cache:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWD:?falta secreto redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - interna

  correo:
    image: axllent/mailpit:v1.32
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    restart: unless-stopped
    networks:
      - interna

networks:
  interna:

volumes:
  datos-bd:
  datos-cache:
  datos-forgejo: