services:
  tienda:
    image: prestashop/prestashop:8.2
    environment:
      - PS_DEMO_MODE=0
      - PS_INSTALL_AUTO=1
      - PS_LANGUAGE=es
      - PS_COUNTRY=ES
      - PS_FOLDER_ADMIN=admin-tienda
      - PS_FOLDER_INSTALL=install-tienda
      - PS_DOMAIN=${DIRECCION:-localhost}:${PUERTO:-8080}
      - DB_SERVER=${DB_SERVER:?Prestashop necesita un SGBD al que apuntar}
      - DB_NAME=${DB_NAME:-datos}
      - DB_USER=${DB_USER:-usuario}
      - DB_PASSWD=${DB_PASSWD:?Prestashop necesita una passwd}
      - ADMIN_MAIL=${ADMIN_MAIL:-ejemplo@servidor.com}
      - ADMIN_PASSWD=${ADMIN_PASSWD:?Prestashop necesita passwd admin}
    volumes:
      - ficheros-tienda:/var/www/html
    networks:
      - interna
    ports:
      - "${PUERTO:-8080}:80"
    depends_on:
      bd:
        condition: service_healthy
      correo:
        condition: service_started
    restart: unless-stopped

  bd:
    image: mariadb:11.8
    volumes:
      - datos-bd:/var/lib/mysql
    networks:
      - interna
    environment:
      - MARIADB_DATABASE=${DB_NAME:-datos}
      - MARIADB_USER=${DB_USER:-usuario}
      - MARIADB_PASSWORD=${DB_PASSWD:?MariaDB necesita passwd BD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_RANDOM_ROOT_PASSWORD:-1}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped


  correo:
    image: axllent/mailpit:v1.32
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    restart: unless-stopped
    networks:
      - interna


  adminer:
    image: adminer:5
    ports:
      - "${PUERTO_ADMINER:-8081}:8080"
    profiles: ["herramientas"]
    restart: unless-stopped
    networks:
      - interna

volumes:
  datos-bd:
  ficheros-tienda:

networks:
  interna: