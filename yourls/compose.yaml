services:
  web:
    image: nginx:1.30
    ports:
      - "${PUERTO:-8080}:80"
    networks:
      - frontal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d:ro
      - codigo:/etc/nginx:ro


  yourls:
    image: yourls:1.10.6-fpm
    networks:
      - frontal
      - interna
    volumes:
      - codigo:/var/www/html
    # environment


  bd:
    image: mariadb:11.8
    networks:
      - interna

networks:
  frontal:
  interna:

volumes:
  codigo:
  datos-bd:
